# Every Quill in the catalog is fetched at its pinned release and checked
# against the pinned datamodels, as a server would before installing it.
name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest "cloudmorrow[server] @ git+https://github.com/Cloudmorrow/cloudmorrow"
      - run: python -m pytest -q tests
      - name: check
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from cloudmorrow.server.quills import QuillRegistry, fetch, load_catalog
          catalog = load_catalog("catalog.toml")
          ids = [q["id"] for q in catalog.quills]
          assert len(ids) == len(set(ids)), "a Quill is listed twice"
          categories = {c["id"] for c in catalog.categories}
          with tempfile.TemporaryDirectory() as tmp:
              tmp = Path(tmp)
              models = fetch(catalog.datamodels["repo"], catalog.datamodels["ref"], into=tmp / "models")
              for entry in catalog.quills:
                  assert entry.get("category") in categories, f"{entry['id']}: unknown category"
                  folder = fetch(entry["repo"], entry["ref"], into=tmp / entry["id"])
                  registry = QuillRegistry(tmp / "q" / entry["id"], tmp / "m" / entry["id"])
                  plan = registry.plan(folder, models)
                  assert plan["id"] == entry["id"], f"{entry['repo']} is {plan['id']}, not {entry['id']}"
                  print(f"✓ {entry['id']} {plan['version']}")
          PY
      # A pull request somebody opened: the review's rules on every release it
      # changes, and what to look closely at for the person reviewing it.
      - name: review
        if: github.event_name == 'pull_request'
        run: python scripts/review.py --base "origin/${{ github.base_ref }}"
